networks:
  workstation-network:
    driver: bridge
  workstation-preview-network:
    name: workstation-preview-network
    driver: bridge
    external: false

volumes:
  postgres_data:
  redis_data:
  image_outputs:
  comfyui_data:
  comfyui_models:
  drupal_data:
  drupal_db_data:
  studio_media:
  searxng_data:

services:
  searxng:
    image: searxng/searxng:latest
    container_name: workstation-searxng
    environment:
      SEARX_SECRET_KEY: ${SEARX_SECRET_KEY:-change_me_searxng_secret}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_strong_redis_password}
    expose:
      - "8080"
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - workstation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: workstation-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-./.ollama}:/root/.ollama
    networks:
      - workstation-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${OLLAMA_GPU_DEVICE_ID:-1}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  comfyui:
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda12.6-latest
    container_name: workstation-comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      - comfyui_data:/comfy/mnt
      - comfyui_models:/basedir
      - image_outputs:/basedir/output
    networks:
      - workstation-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${COMFYUI_GPU_DEVICE_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: workstation-postgres
    # Internal only; uncomment ports for local dev access
    # ports:
    #   - "${POSTGRES_PORT:-5433}:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workstation}
      POSTGRES_USER: ${POSTGRES_USER:-workstation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - workstation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workstation_user} -d ${POSTGRES_DB:-workstation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workstation-redis
    # Internal only; uncomment ports for local dev access
    # ports:
    #   - "${REDIS_PORT:-6380}:6379"
    expose:
      - "6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-changeme_strong_redis_password}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - workstation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_strong_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workstation-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://workstation_user:change_me_in_production@postgres:5432/workstation}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_strong_redis_password}@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-generate_random_secret_key_here}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:9080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
      COMFYUI_OUTPUT_DIR: /data/comfyui_outputs
      STUDIO_MEDIA_DIR: /data/studio_media
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      DESKTOP_CONTROL_ENABLED: ${DESKTOP_CONTROL_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # MASTER_USERNAMES and MASTER_PASSWORD are required in production;
      # backend raises RuntimeError on startup if either is missing.
      MASTER_USERNAMES: ${MASTER_USERNAMES:-kevin}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      MASTER_FIRST_NAME: ${MASTER_FIRST_NAME:-}
      MASTER_SCREEN_NAME: ${MASTER_SCREEN_NAME:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_MCP_TOKEN: ${BREVO_MCP_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-Workstation}
      SMS_DEFAULT_RECIPIENT: ${SMS_DEFAULT_RECIPIENT:-}
      DRUPAL_ALLOWED_HOSTS: ${DRUPAL_ALLOWED_HOSTS:-}
      DRUPAL_LOCAL_MOUNT: /drupal-local
      DRUPAL_LOCAL_CONTAINER: ${DRUPAL_LOCAL_CONTAINER:-workstation-drupal}
      DRUPAL_VPS_HOST: ${DRUPAL_VPS_HOST:-}
      DRUPAL_VPS_USER: ${DRUPAL_VPS_USER:-root}
      DRUPAL_VPS_PASSWORD: ${DRUPAL_VPS_PASSWORD:-}
      DRUPAL_VPS_KEY_PATH: ${DRUPAL_VPS_KEY_PATH:-}
      DRUPAL_VPS_PORT: ${DRUPAL_VPS_PORT:-22}
      SSH_TRUST_ALL_HOST_KEYS: ${SSH_TRUST_ALL_HOST_KEYS:-false}
    # Grant Docker socket access to non-root appuser (docker group GID on host)
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - image_outputs:/data/comfyui_outputs
      - studio_media:/data/studio_media
      - ${DRUPAL_LOCAL_PATH:-./drupal-local}:/drupal-local:rw
      - ${DRUPAL_VPS_KEY_FILE:-/dev/null}:/run/secrets/vps_ssh_key:ro
    networks:
      - workstation-network
      - workstation-preview-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${BACKEND_GPU_UTILITY_COUNT:-1}
              capabilities: [utility]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workstation-worker
    # ARQ worker command - expects app/worker.py with WorkerSettings class in backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://workstation_user:change_me_in_production@postgres:5432/workstation}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_strong_redis_password}@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-generate_random_secret_key_here}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
      COMFYUI_OUTPUT_DIR: /data/comfyui_outputs
      STUDIO_MEDIA_DIR: /data/studio_media
    volumes:
      - ./backend:/app
      - image_outputs:/data/comfyui_outputs
      - studio_media:/data/studio_media
    networks:
      - workstation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq.*WorkerSettings' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  chat:
    build:
      context: ./frontend
      dockerfile: apps/chat/Dockerfile
    container_name: workstation-chat
    ports:
      - "${CHAT_PORT:-3001}:3001"
    networks:
      - workstation-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: workstation-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - workstation-network
    depends_on:
      - backend
      - chat
      - drupal
    # Reload nginx every 6h to pick up renewed certificates
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  drupal_db:
    image: mariadb:10.11
    container_name: workstation-drupal-db
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DRUPAL_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DRUPAL_DB_NAME:-drupal}
      MYSQL_USER: ${DRUPAL_DB_USER:-drupal}
      MYSQL_PASSWORD: ${DRUPAL_DB_PASSWORD:-drupal}
      MYSQL_HEALTHCHECK_USER: ${DRUPAL_DB_HEALTHCHECK_USER:-healthcheck}
      MYSQL_HEALTHCHECK_PASSWORD: ${DRUPAL_DB_HEALTHCHECK_PASSWORD:-change_me_healthcheck}
    volumes:
      - drupal_db_data:/var/lib/mysql
      - ./drupal_db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - workstation-network
    healthcheck:
      test: ["CMD-SHELL", "tmp=/tmp/healthcheck.cnf; umask 077; printf '[client]\\nuser=%s\\npassword=%s\\nhost=localhost\\n' \"$${MYSQL_HEALTHCHECK_USER}\" \"$${MYSQL_HEALTHCHECK_PASSWORD}\" > \"$${tmp}\" && mysqladmin --defaults-extra-file=\"$${tmp}\" ping --silent && rm -f \"$${tmp}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  drupal:
    image: drupal:11-apache
    container_name: workstation-drupal
    expose:
      - "80"
    ports:
      - "${DRUPAL_PORT:-8080}:80"
    volumes:
      - drupal_data:/opt/drupal/web
    networks:
      - workstation-network
    depends_on:
      drupal_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: workstation-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Attempt renewal every 12h (certbot skips if not due)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - workstation-network
    restart: unless-stopped
