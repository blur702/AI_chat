# Persistence Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Performance
save 900 1
save 300 10
save 60 10000

# Security
protected-mode yes
bind 0.0.0.0
requirepass changeme_strong_redis_password

# Logging
loglevel notice
