language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "backend/**"
      instructions: "FastAPI + SQLAlchemy async backend. Check for SQL injection, auth issues, proper async usage."
    - path: "frontend/**"
      instructions: "Next.js 14 App Router + React. Check for XSS, proper hook usage, memory leaks."
    - path: "docker-compose.yml"
      instructions: "Check for security issues, exposed ports, missing health checks."
chat:
  auto_reply: true
